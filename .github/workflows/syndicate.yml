name: Syndicate blog posts

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      posts:
        description: "Comma-separated post slugs to sync, or 'all'. Empty: sync posts changed in the last commit."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  syndicate:
    runs-on: ubuntu-latest
    # DEVTO_API_KEY lives in the "syndication" environment (Settings > Environments),
    # restricted to the main branch. Environment secrets are only exposed to jobs
    # that name the environment, so this line is what makes the secret available.
    environment: syndication
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Added posts are created on dev.to; modified posts update the article
      # recorded for their slug in .syndication/devto.json. A manual run can
      # name slugs (or "all") to sync posts the commit diff would not catch.
      - name: Detect changed blog posts
        id: detect
        env:
          REQUESTED: ${{ github.event.inputs.posts }}
        run: |
          : > /tmp/new_posts.txt
          if [ "$REQUESTED" = "all" ]; then
            ls src/blog/*.md > /tmp/new_posts.txt
          elif [ -n "$REQUESTED" ]; then
            for slug in $(echo "$REQUESTED" | tr ',' ' '); do
              match=$(ls src/blog/????-??-??-"$slug".md 2>/dev/null | head -1)
              if [ -n "$match" ]; then
                echo "$match" >> /tmp/new_posts.txt
              else
                echo "::warning::No post found for slug '$slug'"
              fi
            done
          else
            git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'src/blog/*.md' > /tmp/new_posts.txt 2>/dev/null || true
          fi

          if [ ! -s /tmp/new_posts.txt ]; then
            echo "No new or changed blog posts found."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Posts to sync:"
            cat /tmp/new_posts.txt
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load syndication state
        if: steps.detect.outputs.has_new == 'true'
        run: |
          if [ ! -f .syndication/devto.json ]; then
            echo '{}' > .syndication/devto.json
          fi

      - name: Cross-post to dev.to
        if: steps.detect.outputs.has_new == 'true'
        continue-on-error: true
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          while IFS= read -r post_path; do
            [ -z "$post_path" ] && continue

            filename=$(basename "$post_path" .md)
            slug=$(echo "$filename" | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')

            # An existing id means update in place; otherwise create.
            existing_id=$(jq -r --arg s "$slug" '.[$s] // empty' .syndication/devto.json)

            # Extract front matter fields
            title=$(sed -n 's/^title: *"\(.*\)"/\1/p' "$post_path" | head -1)
            description=$(sed -n 's/^description: *"\(.*\)"/\1/p' "$post_path" | head -1)
            crosspost=$(sed -n 's/^crosspost: *//p' "$post_path" | head -1)

            if [ "$crosspost" = "false" ]; then
              echo "Skipping $slug (crosspost: false)"
              continue
            fi

            # Extract tags (simple: grab lines after "tags:" until next field)
            # dev.to tags must be alphanumeric, max four: ai-security -> aisecurity
            tags=$(sed -n '/^tags:/,/^[a-z]/{ /^  - /s/^  - //p }' "$post_path" | head -4 | sed 's/-//g' | paste -sd, -)

            # Extract body (everything after second ---)
            body=$(sed -n '/^---$/,/^---$/!p' "$post_path" | tail -n +1)

            canonical_url="https://codacon.ai/blog/${slug}/"

            # Build JSON payload
            payload=$(jq -n \
              --arg title "$title" \
              --arg body "$body" \
              --arg desc "$description" \
              --arg url "$canonical_url" \
              --arg tags "$tags" \
              '{
                article: {
                  title: $title,
                  body_markdown: $body,
                  description: $desc,
                  canonical_url: $url,
                  published: true,
                  tags: ($tags | split(","))
                }
              }')

            if [ -n "$existing_id" ]; then
              echo "Updating on dev.to: $title (id $existing_id)"
              method=PUT
              endpoint="https://dev.to/api/articles/${existing_id}"
            else
              echo "Publishing to dev.to: $title"
              method=POST
              endpoint="https://dev.to/api/articles"
            fi

            response=$(curl -s -w "\n%{http_code}" \
              -X "$method" "$endpoint" \
              -H "Content-Type: application/json" \
              -H "api-key: ${DEVTO_API_KEY}" \
              -d "$payload")

            http_code=$(echo "$response" | tail -1)
            response_body=$(echo "$response" | sed '$d')

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              article_id=$(echo "$response_body" | jq -r '.id')
              if [ -n "$existing_id" ]; then
                echo "Updated: $slug -> dev.to id $article_id"
              else
                echo "Published: $slug -> dev.to id $article_id"
                jq --arg s "$slug" --arg id "$article_id" '. + {($s): $id}' .syndication/devto.json > /tmp/devto.json
                mv /tmp/devto.json .syndication/devto.json
              fi
            else
              echo "::error::Failed to sync $slug (HTTP $http_code): $response_body"
            fi
          done < /tmp/new_posts.txt

      - name: Generate LinkedIn drafts
        if: steps.detect.outputs.has_new == 'true'
        run: |
          mkdir -p .syndication/linkedin

          while IFS= read -r post_path; do
            [ -z "$post_path" ] && continue

            filename=$(basename "$post_path" .md)
            slug=$(echo "$filename" | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')

            title=$(sed -n 's/^title: *"\(.*\)"/\1/p' "$post_path" | head -1)
            description=$(sed -n 's/^description: *"\(.*\)"/\1/p' "$post_path" | head -1)
            crosspost=$(sed -n 's/^crosspost: *//p' "$post_path" | head -1)

            if [ "$crosspost" = "false" ]; then
              continue
            fi

            tags=$(sed -n '/^tags:/,/^[a-z]/{ /^  - /s/^  - //p }' "$post_path" | head -3 | sed 's/^/#/' | sed 's/-//g' | paste -sd' ' -)

            canonical_url="https://codacon.ai/blog/${slug}/"

            cat > ".syndication/linkedin/${slug}.txt" <<LINKEDIN
          ${title}

          ${description}

          Read the full post: ${canonical_url}

          ${tags} #codacon
          LINKEDIN

            echo "Generated LinkedIn draft: ${slug}.txt"
          done < /tmp/new_posts.txt

      # TODO: LinkedIn API auto-post requires an approved developer app with
      # w_member_social scope. For now, drafts are generated as text files.
      # Revisit when LinkedIn provides a simpler personal posting flow.

      - name: Commit syndication state
        if: steps.detect.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .syndication/
          git diff --cached --quiet || git commit -m "Update syndication state"
          git push || echo "Nothing to push"
